{{define "main"}}
<div id="failing-alert">{{template "failing-alert" .}}</div>

<div id="jobs-controls" class="bar">{{template "jobs-controls" .}}</div>

<div class="work">
    <div id="jobs-container"
         hx-get="{{url "/api/jobs"}}"
         hx-trigger="load, every 5s, refresh-jobs from:body"
         hx-include="#search, #selected-job"
         hx-swap="innerHTML"
         hx-on::after-request="uiPollDone(this, event)">
        {{template "jobs-table" .}}
    </div>
    <div class="scrim"></div>
    <aside id="inspector" aria-label="Job inspector" hx-on::after-swap="uiInspectorSwapped(this, event)"></aside>
</div>
{{end}}
